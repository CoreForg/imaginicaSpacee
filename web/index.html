<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Imaginica Space — Premium Digital Product Studio. We build mobile apps, SaaS platforms, and startup MVPs at affordable pricing.">
  <meta name="keywords" content="Flutter, mobile app development, SaaS, startup MVP, full stack, UI/UX design, digital products">
  <meta name="author" content="Imaginica Space">

  <!-- Open Graph -->
  <meta property="og:title" content="Imaginica Space — Premium Digital Product Studio">
  <meta property="og:description" content="High-quality apps and digital products built for startups and businesses at startup-friendly pricing.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Imaginica Space">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Theme color for browser chrome -->
  <meta name="theme-color" content="#09090B">

  <style>
    body {
      background-color: #09090B;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transition: opacity 0.4s ease;
    }
    .loading-container.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .logo-pulse {
      width: 72px;
      height: 72px;
      animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
      filter: drop-shadow(0 0 16px rgba(139, 92, 246, 0.4));
    }
    .loading-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #A1A1AA;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(59, 130, 246, 0.15);
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <title>Imaginica Space — Premium Digital Product Studio</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #09090B;">
  <div class="loading-container" id="loading-indicator">
    <img src="icons/Icon-192.png" alt="Imaginica Space" class="logo-pulse" />
    <div class="spinner"></div>
    <span class="loading-text">Imaginica Space</span>
  </div>

  <script>
    // Hide the loader with a fade once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function () { loader.style.display = 'none'; }, 450);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
